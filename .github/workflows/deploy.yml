name: CI/CD for AIOps Dashboard Project

on:
  push:
    branches:
      - main
    paths:
      - 'lambda-package/**'
      - '.github/workflows/deploy.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Pylint-Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f lambda-package/requirements.txt ]; then pip install -r lambda-package/requirements.txt; fi

      - name: Run pylint
        run: |
          pylint lambda-package/*.py \
            --fail-under=7 \
            --disable=missing-docstring,line-too-long,too-many-arguments,too-many-branches,too-many-statements,too-many-locals,too-many-return-statements,invalid-name,consider-using-f-string,no-name-in-module

  Deployment:
    name: Deploy to Lambda and S3
    runs-on: ubuntu-latest
    needs: Pylint-Analysis
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Create deployment package
        run: |
          cd lambda-package
          zip -r ../deployment_package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name aiops-ai-analyzer \
            --zip-file fileb://deployment_package.zip

      - name: Deploy Frontend to S3
        run: |
          aws s3 cp index.html s3://${{ secrets.AWS_S3_FRONTEND_BUCKET }}/index.html --content-type "text/html"